name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Sync frontend for panel embed
        run: |
          rm -rf panel/web/dist
          mkdir -p panel/web
          cp -R web/dist panel/web/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Prepare dist directory
        run: mkdir -p dist

      - name: Build agent
        working-directory: agent
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o ../dist/onlytun-agent-linux-${GOARCH} .

      - name: Build panel
        working-directory: panel
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o ../dist/onlytun-panel-linux-${GOARCH} .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: OnlyTun ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/onlytun-agent-linux-${{ matrix.arch }}
            dist/onlytun-panel-linux-${{ matrix.arch }}
