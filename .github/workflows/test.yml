name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Test agent
        working-directory: agent
        run: go test ./... -v -race -timeout 60s

      - name: Test panel
        working-directory: panel
        run: go test ./... -v -timeout 60s

      - name: Vet agent
        working-directory: agent
        run: go vet ./...

      - name: Vet panel
        working-directory: panel
        run: go vet ./...
